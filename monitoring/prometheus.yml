# Prometheus — конфиг scrape/eval.
# Контракт: .spec/contracts/ — Triton metrics :8002 (/metrics),
# в compose-сети triton-net хост называется "triton"; среда CPU-only (GPU/DCGM не обещаны).
# alerts.yml монтируется в контейнер Prometheus (deployment/docker-compose.yml)
# по пути /etc/prometheus/alerts.yml — интеграционная точка стыковки (H-канал, этап 7).

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets: ["triton:8002"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
